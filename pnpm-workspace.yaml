# pnpm settings (the registry is in .npmrc). A single package, no workspace.

# Resolve no version, direct or transitive, published less than two weeks
# ago (in minutes).
minimumReleaseAge: 20160

overrides:
  # @napi-rs/wasm-runtime takes @emnapi/core and @emnapi/runtime as peers,
  # `^1 || ^2.0.0-alpha`, and pnpm resolves each one alone: a 2.0 beta of one
  # beside 1.x of the other crashes astro check on exit. Keep both on 1.x.
  '@emnapi/core': 1.11.3
  '@emnapi/runtime': 1.11.3
