# What script/check-all runs locally, plus a secret scan of the whole history.
# Every action is pinned to a full commit SHA, its tag in the comment.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The release binary, checked against its published SHA-256.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secrets in the git history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # pnpm only exists after corepack enable, below.
          package-manager-cache: false
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: devtab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devtab -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_OWNER_URL: postgres://postgres@127.0.0.1:5432/devtab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ''
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-deny (prebuilt, checksum verified)
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      # sqlx-cli publishes no release binaries; built from crates.io like on a
      # developer's machine (rust-cache keeps ~/.cargo/bin between runs).
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      - name: Migrations apply from zero
        run: sqlx migrate run --source db/migrations --database-url "$DATABASE_OWNER_URL"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test (with the database)
        run: cargo test --locked --workspace
        env:
          DEVTAB_TEST_DATABASE_URL: ${{ env.DATABASE_OWNER_URL }}
      - name: Release build
        run: cargo build --locked --release -p devtab-api
      - run: cargo deny check
