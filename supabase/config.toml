# The local Supabase stack for development and CI (Supabase CLI). Reference:
# https://supabase.com/docs/guides/local-development/cli/config
# Only what differs from the CLI's defaults, or matters to this project, is
# set here; no hosted project is linked to this repository.

# Names this stack's containers and volumes, apart from other Supabase projects.
project_id = "devtab-dev-web"

# Ports 54330-54337: away from the CLI's defaults (54320-54329, 8083), so that
# another project's stack on the defaults keeps working next to this one.

[api]
enabled = true
port = 54332
# The Data API (PostgREST) serves only Supabase's own schemas. `app` is never
# listed: application data is reachable only through the Rust API.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
# The database the scripts and the API connect to, as in the README.
port = 54330
shadow_port = 54331
# The major version of the hosted database this one stands in for.
major_version = 17

[db.pooler]
enabled = false
port = 54335

[db.migrations]
enabled = true

[db.seed]
# No seed data yet.
enabled = false

[realtime]
# Not used yet.
enabled = false

[studio]
enabled = true
port = 54333
api_url = "http://127.0.0.1"

# Catches the mail Auth sends locally; nothing leaves the machine.
[inbucket]
enabled = true
port = 54334

[storage]
# Not used yet.
enabled = false

[auth]
enabled = true
# The site's development server; every redirect stays on the loopback address.
site_url = "http://127.0.0.1:4321"
additional_redirect_urls = ["http://127.0.0.1:4321/**", "http://localhost:4321/**"]
jwt_expiry = 3600
# Access tokens are signed with an ES256 key of this machine and checked by
# the API against the published JWKS; the API accepts no shared HS256 secret.
# script/lib/supabase.sh makes the key on first use in the ignored .state/
# (the CLI refuses to start without the file); it is never committed.
signing_keys_path = "../.state/supabase/signing-keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""
# No captcha. The sign-in methods are the owner's decision (e-mail with a link
# and a code, e-mail and password, Google); which ones a deployment offers is
# the site's DEVTAB_SIGN_IN_METHODS. Of the external providers only Google has
# a section here, off unless the environment turns it on; no client id or
# secret belongs in this file.

[auth.rate_limit]
# Mails an hour. Enough for repeated sign-in tests against this local stack;
# a hosted project sets its own limits.
email_sent = 30
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

# E-mail sign-in: a link or a one-time code, or a password; the mail goes to
# inbucket locally. A new address is confirmed by its mail before a password
# signs in: the same mail, with the link and the code (the confirmation
# template below). A hosted project sets the same ("Confirm email").
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# One mail for both: a new address (confirmation) and a known one (magic
# link). It carries the link and the code, in the language the sign-in page
# had when the account was made (user metadata `locale`).
[auth.email.template.magic_link]
subject = "{{ if eq (print .Data.locale) \"ru\" }}Вход на DevTab.Dev{{ else }}Sign in to DevTab.Dev{{ end }}"
content_path = "./supabase/templates/sign_in.html"

[auth.email.template.confirmation]
subject = "{{ if eq (print .Data.locale) \"ru\" }}Вход на DevTab.Dev{{ else }}Sign in to DevTab.Dev{{ end }}"
content_path = "./supabase/templates/sign_in.html"

# A forgotten password: a link back to the site's /auth/callback/ and a code
# for /forgot-password/, either of which leads to /reset-password/.
[auth.email.template.recovery]
subject = "{{ if eq (print .Data.locale) \"ru\" }}Новый пароль для DevTab.Dev{{ else }}A new password for DevTab.Dev{{ end }}"
content_path = "./supabase/templates/recovery.html"

# Who sends Auth's mails. Locally none leaves the machine: every mail goes to
# the mail catcher, so this is off. A stack that sends real mail turns it on
# and names its server and sender in the environment, never in this file:
# SUPABASE_AUTH_EMAIL_SMTP_ENABLED=true, SUPABASE_AUTH_EMAIL_SMTP_HOST, _PORT,
# _USER, _PASS, _ADMIN_EMAIL (the sender's address) and _SENDER_NAME (its
# name). A hosted project sets the same under Authentication, SMTP.
[auth.email.smtp]
enabled = false
host = "env(SUPABASE_AUTH_EMAIL_SMTP_HOST)"
port = 587
user = "env(SUPABASE_AUTH_EMAIL_SMTP_USER)"
pass = "env(SUPABASE_AUTH_EMAIL_SMTP_PASS)"
admin_email = "env(SUPABASE_AUTH_EMAIL_SMTP_ADMIN_EMAIL)"
sender_name = "env(SUPABASE_AUTH_EMAIL_SMTP_SENDER_NAME)"

# Signing in with Google, off unless the environment turns it on:
# SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED=true, with the client of a Google
# Cloud project in SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID and
# SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET. The client's redirect URI is this
# stack's http://127.0.0.1:54332/auth/v1/callback. A hosted project sets the
# same under Authentication, Providers.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.web3.solana]
enabled = false

[edge_runtime]
# Not used yet.
enabled = false
inspector_port = 54337

[analytics]
# Not used yet.
enabled = false
port = 54336
backend = "postgres"
