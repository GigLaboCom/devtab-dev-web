# A test catalogue: the three plans of config/plans.toml, all available, with
# the same placeholder texts and the fake provider's prices in XTS, the code
# ISO 4217 reserves for tests. tests/plans.rs builds the answers of
# contract/plans-v1/server-catalogs.json from it and syncs it into a
# transaction that is rolled back. Never a real price.

[[plan]]
id = "free"
kind = "free"
sort = 1
available = true
[plan.texts.en]
name = "Free"
summary = "Every tool, in full, offline."
includes = ["All 44 tools", "Nothing you paste leaves this browser"]

[[plan]]
id = "pro-monthly"
kind = "subscription"
interval = "month"
