[package]
name = "devtab-api"
version = "0.1.0"
description = "The site's backend API"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap", "quanta"] }
hmac = "0.13.0"
# Supabase Auth's access tokens: ES256 or RS256, checked against the project's JWKS.
jsonwebtoken = { version = "9.3.1", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pem", "std"] }
# Fetches the JWKS and talks to Stripe: rustls with the webpki roots, nothing else.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "uuid", "time", "json"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util", "sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "limit", "timeout", "catch-panic", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = "5.5.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
regex = "1.12.2"
tower = { version = "0.5.3", features = ["util"] }
