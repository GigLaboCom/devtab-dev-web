# The paid plans of config/plans.toml with Stripe prices instead of the fake
# provider's: the shape of a deployment's plans file. Copy it next to the
# deployment, write the final texts, and run
# `devtab-api admin stripe check --file <it>`, then
# `devtab-api admin plans sync --file <it>`.
#
# A Stripe price is named by its lookup key, which the operator gives the
# price at Stripe; the same key in the sandbox and in live mode, so that one
# file serves both. The sync finds the active price with that key and stores
# its id, amount and currency; its interval must be the plan's. A new price:
# create it at Stripe with the same lookup key (transferring the key from the
# old one), then sync again. A price can be named by its id instead
# (`provider_price_id = "price_…"`), which differs between sandbox and live.

[[plan]]
id = "free"
kind = "free"
sort = 1
available = true
[plan.texts.en]
name = "Free"
summary = "Every tool, in full, offline."
includes = ["All 44 tools", "Nothing you paste leaves this browser"]

[[plan]]
id = "pro-monthly"
kind = "subscription"
interval = "month"
seats = 3
sort = 2
available = true
[plan.texts.en]
name = "Monthly"
summary = "Pro, billed every month."
includes = ["Tool history and its archive", "Tools remember your options", "Copy automatically after generating"]
price_note = "Tax calculated at checkout."
[[plan.prices]]
provider = "stripe"
lookup_key = "devtab-pro-monthly"

[[plan]]
id = "pro-annual"
kind = "subscription"
interval = "year"
seats = 3
sort = 3
available = true
[plan.texts.en]
name = "Annually"
summary = "Pro, billed once a year."
includes = ["Everything in Monthly"]
price_note = "Tax calculated at checkout."
badge = "Save 33%"
[[plan.prices]]
provider = "stripe"
lookup_key = "devtab-pro-annual"

# Team plans: sold per member on the site only (the extension's cards show
# the personal plans). Each member gets the plan's seats; the buyer picks the
# number of members on Stripe's page, at least min_members, and changes it
# later in Stripe's customer portal. A team plan's price may be volume-tiered
# at Stripe (every member pays the step the whole team reaches, such as a
# person's price up to four members and less from five); the site shows the
# steps, the extension never sees team plans.

[[plan]]
id = "team-monthly"
kind = "subscription"
interval = "month"
seats = 3
sort = 4
available = true
min_members = 2
[plan.texts.en]
name = "Team, monthly"
summary = "Pro for each member of a team, billed every month."
includes = ["Everything in Pro, for every member", "Invite members by e-mail"]
price_note = "Per member, less from 5. Tax at checkout."
[[plan.prices]]
provider = "stripe"
lookup_key = "devtab-team-monthly"

[[plan]]
id = "team-annual"
kind = "subscription"
interval = "year"
seats = 3
sort = 5
available = true
min_members = 2
[plan.texts.en]
name = "Team, annually"
summary = "Pro for each member of a team, billed once a year."
includes = ["Everything in Team, monthly"]
price_note = "Per member, less from 5. Tax at checkout."
badge = "Save with a year"
[[plan.prices]]
provider = "stripe"
lookup_key = "devtab-team-annual"
